[package]
name = "packagist-stats-tracker"
version = "0.1.4"
edition = "2024"
description = "Track download statistics for Composer packages from Packagist"
license = "MIT"
repository = "https://github.com/raphaelstolt/packagist-stats-tracker"
readme = "README.md"
keywords = ["packagist", "composer", "cli", "statistics"]
categories = ["command-line-utilities"]
exclude = [".gitignore", ".github/", "tests/", "CONTRIBUTING.md", "Justfile", "CHANGELOG.md", "RELEASE.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
reqwest = "0.13.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.28.0"
wiremock = "0.6.5"
